parameters:
  - $ref: "../components/parameters.yaml#/OrgIdParam"
  - $ref: "../components/parameters.yaml#/OrgIdHeader"

get:
  operationId: listOrgRoles
  summary: List this shop's roles (the invite dropdown)
  description: >
    F-002 (api-spec §3.6). Any ACTIVE member may read it: the response carries
    no personal data and nothing about anybody else — the shop's live role
    names. Requiring `manage_members` would mean a Staff member could not be
    shown the name of their own role. Deleted roles are not listed.


    F-003: still NO `capabilities` (AC-6.4 — reading what a role allows needs
    `manage_roles`, via the role-details read). Each row adds `nameCustomized`
    (display rule) and `viewerCanAssign` / `assignBlockedReason`, which are
    present only when the caller holds `manage_members`.


    It exists because AC US-3 makes choosing a role MANDATORY when inviting
    somebody: without this endpoint no client can populate that dropdown, so the
    acceptance criterion could not be met at all.


    The list itself is read-only. `POST` on this same path (F-003) creates a
    role and requires `manage_roles`; update/delete are `/roles/{roleId}`.
  tags:
    - organizations
  security:
    - bearerAuth: []
  responses:
    "200":
      description: Every role of this shop, oldest first.
      headers:
        Cache-Control:
          $ref: "../components/headers.yaml#/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "../components/orgs.yaml#/RoleListPage"
    "401":
      description: Missing/invalid access token (`UNAUTHENTICATED`)
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "403":
      description: >
        `ORG_ACCESS_DENIED` — not an active member of this shop (including the
        shop not existing: the two are indistinguishable on purpose, I-5).
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "422":
      description: >
        `ORG_MISMATCH` — `X-Organization-Id` disagrees with the path (a client
        bug; the server never picks a side).
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"

post:
  operationId: createOrgRole
  summary: Create a custom role (also how "clone" is done)
  description: >
    F-003 (api-spec §1, §2, AC-3.1..3.7, AC-4.2, AC-5.1). Requires
    `manage_roles`. There is no clone endpoint: the client pre-fills this
    request from the source role (`RoleDetail`) and sends it like any create.


    The created role always has `key: null` and `isSystem: false`; `key`,
    `isSystem` and `version` in the body are ignored (AC-1.4). `name` comes back
    normalised (NFC, trimmed, inner whitespace collapsed) and `capabilities` in
    canonical form (deduplicated, implied keys removed, sorted).


    ⚠️ ROLLOUT FLAG: while `ROLE_WRITES_ENABLED` is off the server answers
    `503 ROLE_WRITES_DISABLED` to callers who hold `manage_roles` — the same
    state `viewer.canCreate.reason = "writes_disabled"` already reports. A
    caller WITHOUT `manage_roles` gets `403 FORBIDDEN` either way.


    FIXED CHECK ORDER (api-spec §2): `manage_roles` (`403 FORBIDDEN`) → flag
    (`503`) → rate limit (`429`) → `manage_roles` re-read inside the
    transaction (`403 FORBIDDEN`) → body shape (`422 VALIDATION_FAILED`) → name
    (`422 VALIDATION_FAILED` length / invisible characters, then
    `409 ROLE_NAME_TAKEN` for a reserved system-role label) → `ROLE_EMPTY` →
    `FULL_ACCESS_RESERVED` → `UNKNOWN_CAPABILITY` → `ROLE_EXCEEDS_ACTOR` →
    `ROLE_LIMIT_REACHED` → write (a live role with the same name, ignoring
    case → `409 ROLE_NAME_TAKEN`).


    Rate limit `roleWrite`: 60 role writes per hour per shop, shared by
    create / update / delete.
  tags:
    - roles
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/roles.yaml#/CreateRoleRequest"
  responses:
    "201":
      description: >
        The role as created — the same `RoleDetail` `GET /orgs/{orgId}/roles/{roleId}`
        returns (`version: 1`, `lastEdited.by.kind: "me"`).
      headers:
        Cache-Control:
          $ref: "../components/headers.yaml#/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "../components/roles.yaml#/RoleDetail"
    "401":
      description: Missing/invalid access token (`UNAUTHENTICATED`)
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "403":
      description: >
        `FORBIDDEN` — missing `manage_roles` (at the guard, or re-read inside the
        transaction) · `ROLE_EXCEEDS_ACTOR` — the role would hold a capability
        you do not (no `details`) · `ORG_ACCESS_DENIED` — not an active member
        of this shop.
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "409":
      description: >
        `ROLE_NAME_TAKEN` — a live role of this shop already has this name
        (normalised, case-insensitive) or the name is a system role's label ·
        `ROLE_LIMIT_REACHED` (+`details.limit`) — the shop has the maximum number
        of live roles (system roles included) · `LAST_OWNER` — defensive Owner
        check, not expected · `CONFLICT` + `details.reason = "busy"` (lock
        contention, retry).
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "415":
      description: Non-JSON Content-Type (`UNSUPPORTED_MEDIA_TYPE`)
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "422":
      description: >
        `VALIDATION_FAILED` (+`fieldErrors.name` / `fieldErrors.capabilities`) —
        malformed body, name empty / over 50 code points / containing invisible
        or control characters · `ROLE_EMPTY` (+`fieldErrors.capabilities`) ·
        `FULL_ACCESS_RESERVED` (+`fieldErrors.capabilities`) — `full_access` is
        the Owner's alone · `UNKNOWN_CAPABILITY` (+`details.capabilities`,
        `fieldErrors.capabilities`) — not a selectable key of the catalog ·
        `ORG_MISMATCH` — `X-Organization-Id` disagrees with the path.
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "429":
      description: "`RATE_LIMITED` — `roleWrite`: 60 role writes per hour per shop."
      headers:
        Retry-After:
          $ref: "../components/headers.yaml#/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "503":
      description: >
        `ROLE_WRITES_DISABLED` — role writes are switched off while the release
        rolls out (`viewer.canCreate.reason = "writes_disabled"`). Only callers
        holding `manage_roles` see it.
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
