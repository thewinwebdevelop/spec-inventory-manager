get:
  operationId: listMyOrganizations
  summary: List the shops I belong to (org switcher)
  description: >
    F-002 US-2 (api-spec §3.2). USER-SCOPED — "which shops am I in?" has no
    single org to be scoped to, so `X-Organization-Id` is ignored (I-3).


    `status=active` (the default) is evaluated as a DATABASE FILTER on every
    request: no cache, no TTL. A client that receives `403 ORG_ACCESS_DENIED`
    refetches this endpoint and the shop it was removed from is already gone
    (AC US-5 / D-027).


    `status=all` additionally returns shops the caller was removed from, and
    those rows come back in the SHORT shape — id, name, status, `revokedAt` and
    nothing else (M-10). The role they held and the plan that shop is on are
    internal facts about an organization they are no longer part of.


    ⚠️ `?withTotal=true` is NOT supported here (see the T-002-21 report):
    api-spec §1 states the convention generally, but only
    `GET /orgs/{orgId}/members` implements it. An unknown query parameter is
    ignored, so asking for it simply yields no `total`.
  tags:
    - organizations
  security:
    - bearerAuth: []
  parameters:
    - name: status
      in: query
      required: false
      description: >
        `active` (default) returns the full shape. `all` adds shops the caller
        was removed from, in the short shape. Any other value → `422`.
      schema:
        type: string
        enum:
          - active
          - all
        default: active
    - $ref: "../components/parameters.yaml#/CursorParam"
    - $ref: "../components/parameters.yaml#/LimitParam"
  responses:
    "200":
      description: One page, sorted `createdAt desc, id desc`.
      content:
        application/json:
          schema:
            $ref: "../components/orgs.yaml#/MyOrganizationsPage"
    "401":
      description: Missing/invalid access token (`UNAUTHENTICATED`)
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "422":
      description: >
        `VALIDATION_FAILED` — unknown `status`, unreadable `cursor`, or a
        `limit` that is not a positive integer (`fieldErrors` names the field).
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
