post:
  operationId: authChangePassword
  summary: Change the caller's own password
  description: >
    US-6 (D-008). Bearer-authed, org-agnostic. Verifies currentPassword
    (account-throttled, N-2), enforces the signup policy on newPassword,
    sets the new hash, and revokes all the caller's OTHER families — sparing
    the current family resolved from the presented refresh token
    (cookie/body, N-1); if none is resolvable, revokes ALL (safe direction).
    CSRF-checked on the cookie path.
  tags:
    - auth
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/auth.yaml#/ChangePasswordRequest"
  responses:
    "200":
      description: Password changed
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/OkResponse"
    "401":
      description: >
        `UNAUTHENTICATED` — missing/invalid access token — or
        `INVALID_CREDENTIALS` — `currentPassword` did not verify (the same
        generic code login uses).
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "403":
      description: "`CSRF_FAILED` — the CSRF check failed on the cookie path"
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "415":
      description: "`UNSUPPORTED_MEDIA_TYPE` — non-JSON Content-Type (L-2)"
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "422":
      description: >
        `newPassword` failed the signup policy: `PASSWORD_TOO_SHORT` (< 8) ·
        `PASSWORD_TOO_LONG` (> 128) · `PASSWORD_BREACHED`. Same three values as
        `POST /auth/signup` — one pure policy function, one set of codes.


        The policy runs AFTER `currentPassword` is verified, so a 422 here is
        never an answer about somebody else's account.


        ⚠️ Not exhaustive — see the note on `POST /auth/signup` `422`.
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "429":
      description: >
        `RATE_LIMITED` — the `currentPassword` backoff tripped (Retry-After
        seconds, N-2).
      headers:
        Retry-After:
          $ref: "../components/headers.yaml#/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
