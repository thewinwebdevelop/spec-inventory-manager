post:
  operationId: authAdminResetPassword
  summary: Admin resets a member's password
  description: >
    US-5. Bearer-authed. The capability check is INLINE application logic
    (F-001-owned): the caller must have an ACTIVE Membership(orgId) whose
    role grants `manage_members`, AND the target must be an ACTIVE member of
    orgId (H-2). Any failure → the same-shape 404 (never 403 — no
    org-existence/status/capability oracle). On success: sets the target's
    password and revokes all the target's families. The capability check is
    not expressible as an OpenAPI security requirement.


    ⚠️ THE WIRE SHAPE IS UNCHANGED SINCE F-001, BUT THE BEHAVIOUR NARROWED
    TWICE — cases that used to answer `200` now answer the SAME `404`, and no
    diff tool can see it (api-spec §2 note / architecture §15):
      • D-028/C-2 — the target also holds an active membership in ANOTHER shop;
      • D-030/NEW-1 — the target is an Owner (role holds `full_access`) and the
        caller does not hold `full_access`.
    Accepted consequence (D-030): a shop with a single Owner who forgets their
    password cannot self-recover until F-081.
  tags:
    - auth
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../components/parameters.yaml#/OrgIdParam"
    - $ref: "../components/parameters.yaml#/UserIdParam"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/auth.yaml#/AdminResetRequest"
  responses:
    "200":
      description: Member password reset
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/OkResponse"
    "401":
      description: Missing/invalid access token
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "404":
      description: >
        Same-shape not-found — caller lacks an active membership / capability,
        or the target is not an active member (never 403; no enumeration).
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "409":
      description: >
        ADDITIVE (T-002-21, closing a documentation debt — the server has
        answered this since T-002-09/§15 row 6b, the contract simply never said
        so). `CONFLICT` + `details.reason = "busy"`: this request lost the race
        for the shop's row lock, or hit a deadlock / statement timeout. It is
        transient — retry. It is deliberately NOT a 500 (ordinary contention
        must not page on-call) and deliberately NOT folded into the uniform 404
        (that would make a retryable state look like a permission answer).
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "415":
      description: Non-JSON Content-Type
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "422":
      description: newPassword policy failure
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "429":
      description: Admin reset-attempt backoff tripped (Retry-After seconds)
      headers:
        Retry-After:
          $ref: "../components/headers.yaml#/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
