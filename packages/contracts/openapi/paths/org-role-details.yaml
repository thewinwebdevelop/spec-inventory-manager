parameters:
  - $ref: "../components/parameters.yaml#/OrgIdParam"
  - $ref: "../components/parameters.yaml#/OrgIdHeader"

get:
  operationId: listOrgRoleDetails
  summary: Every live role of this shop, in full (the role list screen)
  description: >
    F-003 (api-spec §1, §3). Each item is a `RoleDetail` — capabilities, usage
    counts, who edited it last and the caller's per-role verdicts — and the page
    carries the create verdict and the role ceiling. Requires `manage_roles`.


    A separate path from `GET /orgs/{orgId}/roles` on purpose: that list is
    readable by every active member and does NOT publish `capabilities`
    (AC-6.4); one route, one capability.


    One page, oldest first (`createdAt asc, id asc`); `nextCursor` is always
    `null` while the role ceiling fits in a page. `viewer.*` is a UX input — a
    write re-reads permissions and may still refuse. While role writes are
    switched off every write verdict is `writes_disabled`.
  tags:
    - roles
  security:
    - bearerAuth: []
  responses:
    "200":
      description: Every live role, oldest first.
      headers:
        Cache-Control:
          $ref: "../components/headers.yaml#/CacheControlNoStore"
      content:
        application/json:
          schema:
            $ref: "../components/roles.yaml#/RoleDetailListPage"
    "401":
      description: Missing/invalid access token (`UNAUTHENTICATED`)
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "403":
      description: >
        `FORBIDDEN` — missing `manage_roles` · `ORG_ACCESS_DENIED` — not an
        active member of this shop.
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
    "422":
      description: "`ORG_MISMATCH` — `X-Organization-Id` disagrees with the path."
      content:
        application/json:
          schema:
            $ref: "../components/common.yaml#/ErrorResponse"
