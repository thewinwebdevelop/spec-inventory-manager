# F-003 — custom roles and the capability catalog (api-spec §2, §3).
#
# ⚠️ T-003-B01 PUBLISHED THESE SHAPES AHEAD OF THEIR ROUTES. B21 now serves the
# three GETs; the request/delete shapes still wait: each route lands with the task that serves it (B21 capabilities +
# role-details + role detail · B23 POST · B24 PATCH · B25 DELETE), because the
# router↔spec parity gate refuses a path the server does not answer (Q-T1).
# They are pulled into the bundle through `components.schemas` in root.yaml so
# the generated TS/Dart clients carry the types from day one.
#
# Conventions (api-spec §1/§3): timestamps are ISO-8601 UTC strings; `key` /
# `roleKey` are FOR TRANSLATION ONLY — never an authorization input; every
# field documented as an OPEN SET is a plain `string` on purpose — a client
# MUST show generic copy for a value it does not recognise, and an `enum` here
# would make both generators refuse the response instead.

# ── the role, in full (manage_roles only) ───────────────────────────────────

RoleDetail:
  type: object
  description: >
    One role in full — the body of the role detail read, each item of the role
    list page, and the success body of creating or updating a role
    (api-spec §3). Readable only by a holder of `manage_roles`.


    Unlike `RoleRow` (readable by every active member), this DOES publish
    `capabilities`: the reader can already edit roles, so the list is the thing
    they are here to see.
  required:
    - id
    - name
    - key
    - nameCustomized
    - isSystem
    - grantsOwnership
    - capabilities
    - version
    - usage
    - lastEdited
    - viewer
    - createdAt
  properties:
    id:
      type: string
    name:
      type: string
      description: >
        The stored name, already normalised (NFC, trimmed, inner whitespace
        collapsed). Display rule (AC-1.5): `nameCustomized ? name : (translate
        key ?? name)`.
    key:
      type:
        - string
        - "null"
      description: >
        Stable slug for TRANSLATION ONLY: `owner`, `admin` or `staff` for the
        system presets, `null` for every role a user created. OPEN SET — on
        `null` or an unrecognised value fall back to `name`.


        ⛔ NEVER a permission input. Whether a role grants ownership is
        `grantsOwnership`; what it allows is `capabilities`.
    nameCustomized:
      type: boolean
      description: >
        The shop renamed this role (always `true` for a role with `key: null`).
        When `true`, show `name` as-is instead of translating `key`.
    isSystem:
      type: boolean
      description: >
        The locked Owner role. It can be neither edited, renamed nor deleted.
        `viewer` already says so per action — use this for labelling only.
    grantsOwnership:
      type: boolean
      description: >
        Derived server-side from `capabilities` (`full_access`), never from
        `key`.
    capabilities:
      type: array
      items:
        type: string
      description: >
        The CANONICAL stored set, sorted by key (api-spec §2): a key implied by
        another key in the set is not repeated. The Owner role is exactly
        `["full_access"]`. May contain keys whose catalog `status` is
        `upcoming`, and — from an older catalog — keys a client does not know:
        render those generically, never drop them silently.
    version:
      type: integer
      minimum: 1
      description: >
        Optimistic-concurrency token. Send it back unchanged in
        `UpdateRoleRequest.version`. On a version conflict the client MUST
        re-fetch this role and show the difference — it must never resubmit
        automatically with the newer version (AC-3.12).
    usage:
      $ref: "./roles.yaml#/RoleUsage"
    lastEdited:
      description: >
        `null` = never edited since the system provisioned it ("ค่าเริ่มต้นของระบบ",
        AC-9.6).
      oneOf:
        - $ref: "./roles.yaml#/RoleLastEdited"
        - type: "null"
    viewer:
      $ref: "./roles.yaml#/RoleDetailViewer"
    createdAt:
      type: string
      format: date-time

RoleUsage:
  type: object
  description: >
    How many hold this role — counts only, never who (AC-6.4).
  required:
    - activeMembers
    - pendingInvitations
  properties:
    activeMembers:
      type: integer
      minimum: 0
    pendingInvitations:
      type: integer
      minimum: 0
      description: >
        Invitations still `pending` for this role, INCLUDING ones whose link has
        expired (AC-3.9) — both block deletion.

RoleLastEdited:
  type: object
  required:
    - at
    - by
  properties:
    at:
      type: string
      format: date-time
    by:
      $ref: "./roles.yaml#/RoleLastEditedBy"

RoleLastEditedBy:
  type: object
  description: >
    Who last edited the role, as the VIEWER may know it (AC-9.6). Decided at
    read time against this shop only. There is deliberately no e-mail, user id
    or display name on the wire (api-spec §3 — `displayName` waits for a
    profile feature; adding an optional field later is non-breaking).
  required:
    - kind
  properties:
    kind:
      type: string
      description: >
        OPEN SET. `me` → "คุณ" · `member` → the editor's CURRENT role in this
        shop (the three `role*` fields below) · `former_member` → "อดีตสมาชิก"
        (no longer an active member of this shop, including a deleted account).
        Any other value → generic copy.
    roleName:
      type: string
      description: Present only when `kind` is `member`. Display per AC-1.5.
    roleKey:
      type:
        - string
        - "null"
      description: >
        Present only when `kind` is `member`. Translation only — OPEN SET, fall
        back to `roleName`.
    roleNameCustomized:
      type: boolean
      description: Present only when `kind` is `member`.

# ── what the caller may do (UX input, never enforcement) ───────────────────

RoleWriteVerdict:
  type: object
  description: >
    The server's verdict for THIS caller at read time — whether to enable a
    button and why not. It is a UX input: every write re-reads the caller's
    permissions inside its transaction and may still refuse (AC-5.7).
  required:
    - allowed
    - reason
  properties:
    allowed:
      type: boolean
    reason:
      type:
        - string
        - "null"
      description: >
        `null` when `allowed` is `true`. OPEN SET (api-spec §3), first match
        wins in this fixed order: `writes_disabled` → `role_locked` →
        `exceeds_your_permissions` → `in_use_requires_manage_members` →
        `equal_permissions_in_use` → `in_use` → `history_limit_reached`;
        `canClone` uses `owner_role` · `exceeds_your_permissions` ·
        `role_limit_reached` · `writes_disabled`; `canCreate` uses
        `role_limit_reached` · `writes_disabled`. `writes_disabled` outranks
        every other reason while role writes are switched off. Any other value
        → generic copy.

RoleDetailViewer:
  type: object
  description: >
    Per-role verdicts. `canEdit` covers renaming too. `canClone` is not affected
    by who holds the role — cloning never touches anyone's permissions.
  required:
    - canEdit
    - canDelete
    - canClone
  properties:
    canEdit:
      $ref: "./roles.yaml#/RoleWriteVerdict"
    canDelete:
      $ref: "./roles.yaml#/RoleWriteVerdict"
    canClone:
      $ref: "./roles.yaml#/RoleWriteVerdict"

RoleDetailListViewer:
  type: object
  required:
    - canCreate
    - limit
  properties:
    canCreate:
      $ref: "./roles.yaml#/RoleWriteVerdict"
    limit:
      type: integer
      minimum: 1
      description: How many live roles this shop may have (the create ceiling).

RoleDetailListPage:
  type: object
  required:
    - items
    - nextCursor
    - viewer
  properties:
    items:
      type: array
      description: Every live role of the shop, `createdAt asc, id asc`.
      items:
        $ref: "./roles.yaml#/RoleDetail"
    nextCursor:
      type:
        - string
        - "null"
      description: >
        Always `null` while the role ceiling fits in one page. Present so a
        client written today survives the day it is not.
    viewer:
      $ref: "./roles.yaml#/RoleDetailListViewer"

# ── requests ───────────────────────────────────────────────────────────────

CreateRoleRequest:
  type: object
  description: >
    Creates a custom role; "clone" is this same request pre-filled from another
    role. There is no `key`, `isSystem` or `version`: unknown fields are
    stripped, so a created role always has `key: null` (AC-1.4).
  required:
    - name
    - capabilities
  properties:
    name:
      type: string
      description: >
        1–50 code points AFTER the server normalises it (NFC, trim, collapse
        inner whitespace); invisible/control characters (Unicode Cc/Cf) are
        refused. The response carries the normalised name.
    capabilities:
      type: array
      maxItems: 64
      items:
        type: string
        maxLength: 64
      description: >
        Keys from the capability catalog with `selectable: true`. Stored in
        canonical form (api-spec §2) — the response may differ from what was
        sent (duplicates and implied keys removed, sorted).

UpdateRoleRequest:
  type: object
  description: >
    Rename and/or replace the capability set. At least one of `name` and
    `capabilities` must be sent. Sending the values already stored is a no-op:
    `200` with the current role, `version` unchanged.
  required:
    - version
  properties:
    version:
      type: integer
      minimum: 1
      description: The `RoleDetail.version` the user was looking at.
    name:
      type: string
      description: Same rules as `CreateRoleRequest.name`.
    capabilities:
      type: array
      maxItems: 64
      items:
        type: string
        maxLength: 64
      description: >
        The WHOLE new set (replace, not a diff). Same rules as
        `CreateRoleRequest.capabilities`.

DeletedRole:
  type: object
  description: >
    The success body of deleting a role. Deletion is soft: history keeps
    showing the role's name (AC-3.9b), but it is gone from every live list.
  required:
    - id
    - deletedAt
  properties:
    id:
      type: string
    deletedAt:
      type: string
      format: date-time

# ── the capability catalog (org-scoped) ────────────────────────────────────

CapabilityCatalog:
  type: object
  description: >
    The capabilities this shop can see (data-model §1). Cache it PER SHOP: an
    entitlement-gated tier is hidden entirely, not flagged (AC-7.4).
  required:
    - groups
    - items
  properties:
    groups:
      type: array
      description: Checklist sections, in display order.
      items:
        $ref: "./roles.yaml#/CapabilityGroup"
    items:
      type: array
      items:
        $ref: "./roles.yaml#/CapabilityEntry"

CapabilityGroup:
  type: object
  required:
    - key
    - labelTh
  properties:
    key:
      type: string
      description: OPEN SET (e.g. `team`, `shop`, `catalog_stock`, `channels`, `orders`, `finance`).
    labelTh:
      type: string

CapabilityEntry:
  type: object
  description: >
    One capability. The registry's `tier` and `scope` are internal and are not
    published.
  required:
    - key
    - labelTh
    - descriptionTh
    - group
    - status
    - implies
    - selectable
  properties:
    key:
      type: string
      description: >
        Stable snake_case identifier — the value stored in
        `RoleDetail.capabilities`. OPEN SET: new keys ship with new features.
    labelTh:
      type: string
    descriptionTh:
      type: string
      description: One sentence — what holding it actually lets someone do.
    group:
      type:
        - string
        - "null"
      description: >
        A `CapabilityGroup.key`, or `null` for an entry that is not a checklist
        item (`full_access`). OPEN SET — an unknown group goes in a generic
        section.
    status:
      type: string
      description: >
        OPEN SET. `live` · `upcoming` (shown as "เร็ว ๆ นี้"; may be ticked in
        advance, AC-7.5). Any other value → generic copy.
    implies:
      type: array
      items:
        type: string
      description: >
        Keys granted automatically with this one (one level only, e.g.
        `manage_X` → `view_X`). Shown ticked and disabled.
    selectable:
      type: boolean
      description: >
        `false` = may never appear in a create/update request (`full_access`).
