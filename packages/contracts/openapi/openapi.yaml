      - $ref: '#/components/parameters/OrgIdHeader'
    post:
      operationId: reissueInvitationLink
      summary: Issue a NEW link for an existing invitation (rotates the token)
      description: |
        F-002 api-spec §3.12 (D-027). Requires `manage_members`, plus `full_access` when the INVITATION's role holds `full_access` (NEW-2) — reissuing an Owner invitation is handing out Owner, so the rule that gates creating one gates copying it too. Without that, anyone with `manage_members` could make unlimited copies of the Owner key and the D-028 rule would be bypassed wholesale.

        ⚠️ `200`, NOT `201` — nothing is created; an existing invitation's token is rotated. (The implementation shipped `201` in T-002-19 and was corrected to the locked contract in a follow-up commit, rather than the contract being bent to the code.)

        ⚠️ THE PREVIOUS LINK STOPS WORKING IMMEDIATELY, and the expiry RESTARTS from now (`now + TTL(role)`), so an elevated-role invitation can be extended 24 hours at a time. The UI needs a confirmation dialog and must not use the words "copy the existing link".

        The invitation's email and role do not change. Every call emits `org.invitation.link_reissued` so a leaked link can be traced.

        An EXPIRED invitation can still be reissued (its stored status is still `pending`) — deliberately, to avoid a dead end on screen; with the Owner-only rule in place, forbidding it would buy no security.

        `Cache-Control: no-store` + `Referrer-Policy: no-referrer`.
      tags:
        - invitations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A new token and link; the old one is already dead.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReissuedLink'
        '401':
          description: Missing/invalid access token (`UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            `FORBIDDEN` — missing `manage_members`, or reissuing an Owner invitation without `full_access` (nothing is written when this fires) — or `ORG_ACCESS_DENIED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND` — no such invitation in this shop.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `CONFLICT` — the invitation is not in a reissuable state (already accepted or cancelled) · `INVITATION_EXPIRED` — it is past `expiresAt`; an expired link is NOT resurrected, because a `pending` row that can be revived at any time is a permanent standing option rather than an invitation (security review A-9). The way forward is `DELETE /orgs/{orgId}/invitations/{invitationId}` followed by a fresh `POST /orgs/{orgId}/invitations` · or `CONFLICT` + `details.reason = "busy"` (lock contention, retry).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`ORG_CONTEXT_REQUIRED` / `ORG_MISMATCH`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED` — 60 reissues per hour per shop.'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations/preview:
    post:
      operationId: previewInvitation
      summary: Look at an invitation before signing in or signing up (public)
      description: |
        F-002 US-4 (api-spec §3.14). PUBLIC — the invite page has to render before the person decides whether to sign in or sign up, so there is nobody to authenticate. The quota is therefore the ONLY bound on this endpoint: 30/hour per IP (IPv6 collapsed to /64, so one subscriber cannot mint unlimited buckets).

        ⛔ THE TOKEN IS IN THE BODY, NOT THE QUERY STRING (I-6). It is the single secret standing between a stranger and membership of a shop; in a URL it would be written to access logs, to every proxy in front of us and to the `Referer` of anything the invite page loads. A free side effect: a POST is not cached by anything.

        Returns no `organizationId`, no full email address and no member list.

        `Cache-Control: no-store` + `Referrer-Policy: no-referrer`.

        @frontend: read the token out of the URL, `history.replaceState` it away immediately, and keep it in memory (never localStorage) for the whole sign-up → sign-in → accept flow.
      tags:
        - invitations
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemInvitationRequest'
      responses:
        '200':
          description: The invitation, safe for an anonymous viewer.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '404':
          description: |
            `INVITATION_INVALID` — one answer, one body, for an unknown token, a rotated one and a token that never existed. Anything more would turn this public endpoint into an oracle that says "this secret used to be real".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `INVITATION_EXPIRED` · `INVITATION_CANCELLED` · `INVITATION_ALREADY_ACCEPTED`. These ARE distinguished — the caller already holds a token that matched a stored hash, so telling them what happened to it leaks nothing and each answer sends them somewhere different (AC US-4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Non-JSON Content-Type (`UNSUPPORTED_MEDIA_TYPE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_FAILED` — no token in the body (`fieldErrors.token`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED` — 30/hour per IP (IPv6 /64).'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation and join the shop
      description: |
        F-002 US-4 (api-spec §3.15). USER-SCOPED: authenticated, but about the USER, not about an org. The organization comes from the invitation ROW and from nowhere else — `X-Organization-Id` is ignored entirely (I-3), which is a structural property of this route rather than a check somebody must remember.

        The signed-in account's normalized email must match the invited address, otherwise `403 INVITATION_EMAIL_MISMATCH` with `details.emailMasked` so the UI can say which account to use. ⚠️ Phase 0 cannot verify email addresses (F-081), so this is defence in depth, NOT a control: whoever holds the link can redeem it.

        Somebody previously REMOVED from the shop comes back only if the invitation was issued AFTER the removal; otherwise `409 INVITATION_SUPERSEDED`.

        Already an active member → `409 ALREADY_MEMBER` and THE EXISTING ROLE IS NOT TOUCHED (the invitation is marked cancelled so it does not linger). An earlier draft upserted the role here, which opened "accepting an invitation leaves the shop with zero Owners".

        Decision order, pinned by unit test: unknown token → expired → cancelled/accepted → email mismatch → role unavailable → already a member → superseded → success. Every one of these is re-checked INSIDE the transaction that holds the shop's row lock, so `accept` cannot slip between a `revoke`/`cancel`/`reissue` and win.

        `Cache-Control: no-store` + `Referrer-Policy: no-referrer`.
      tags:
        - invitations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemInvitationRequest'
      responses:
        '200':
          description: Joined — enough to enter the shop.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptResult'
        '401':
          description: Missing/invalid access token (`UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            `INVITATION_EMAIL_MISMATCH` (+`details.emailMasked`) — this invitation was issued to a different address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`INVITATION_INVALID` — unknown token (one answer for every reason).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `INVITATION_EXPIRED` · `INVITATION_CANCELLED` · `INVITATION_ALREADY_ACCEPTED` · `ALREADY_MEMBER` · `INVITATION_SUPERSEDED` (the link predates your removal) · `INVITATION_ROLE_UNAVAILABLE` (the invited role was deleted — checked at ACCEPT, not only at creation) · `CONFLICT` + `details.reason = "busy"` (lock contention, retry).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Non-JSON Content-Type (`UNSUPPORTED_MEDIA_TYPE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_FAILED` — no token in the body (`fieldErrors.token`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED` — 30/hour per IP (IPv6 /64), shared with preview.'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Default auth scheme for OmniStock API endpoints. Individual public endpoints (e.g. /health, /auth/signup, /auth/login, /invitations/preview) opt out per operation via `security: []`.
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - error
          description: |
            Literal "ok" when the service is healthy, "error" when one or more dependency checks fail (returned with HTTP 503).
        checks:
          type: object
          description: |
            Additive (T-000-08): per-dependency readiness detail backing `status`. Optional so existing consumers of the AC11 minimal seam are unaffected (contract-evolution: additive-only against an already-shipped surface).
          properties:
            db:
              type: string
              enum:
                - ok
                - fail
              description: Postgres reachability via PrismaService's `SELECT 1`.
            redis:
              type: string
              enum:
                - ok
                - fail
              description: |
                Redis/BullMQ reachability via the ioredis connection's PING + a BullMQ queue call.
    SignupRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    SignupResponse:
      type: object
      required:
        - userId
        - email
        - verified
      properties:
        userId:
          type: string
        email:
          type: string
        verified:
          type: boolean
          enum:
            - false
    ErrorResponse:
      type: object
      description: |
        The project-standard error envelope, produced by `DomainExceptionFilter` for every failure (F-001 §3.5, F-002 api-spec §1/§4). `code` is a machine-readable UPPER_SNAKE value the client switches on; `message` is user-facing Thai copy the client MUST NOT parse.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: |
                Machine-readable error code (e.g. INVALID_CREDENTIALS, ORG_ACCESS_DENIED, RATE_LIMITED). A shipped value never changes.
            message:
              type: string
              description: |
                User-facing Thai message. F-002 copy says "ร้าน" rather than "องค์กร" (D-029); identifiers and enum values stay English.
            details:
              type: object
              additionalProperties: true
              description: |
                Optional, code-specific context. Documented cases (F-002): `INVITATION_PENDING` → `{ invitationId, expiresAt, roleId, roleName }` (§3.11) · `ORG_LIMIT_REACHED` → `{ limit }` (§3.1) · `INVITATION_EMAIL_MISMATCH` → `{ emailMasked }` (§3.15) · `CONFLICT` → `{ reason: "busy" }` when the request lost the race for the shop's row lock (amend #4 / NEW-4 — retryable, never a 500). A client that does not recognise a key MUST still behave correctly.
            fieldErrors:
              type: object
              additionalProperties:
                type: string
              description: |
                Per-field Thai messages on a `422` (e.g. `{ "taxId": "…" }`).
            traceId:
              type: string
              description: |
                Opaque random UUID v4 issued by the SERVER for this request, echoed in `X-Request-Id`. Present on EVERY error response in practice; it stays optional in the schema so already-shipped clients are not broken (api-spec §1, NEW-7). Never derived from client input.
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        deviceId:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: Client session label (arch §4). Not a security boundary.
        tokenTransport:
          type: string
          enum:
            - cookie
            - body
          default: body
          description: |
            Refresh-token delivery channel (api-spec §0). Web sends "cookie"; mobile omits or sends "body".
    TokenResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - tokenType
      properties:
        accessToken:
          type: string
          description: HS256 JWT access token (Bearer). 15-minute TTL.
        refreshToken:
          type:
            - string
            - 'null'
          description: |
            The rotated refresh token on the BODY transport; `null` on the cookie transport (the token is in the httpOnly `omni_rt` cookie, never JS-readable — H-1).
        expiresIn:
          type: integer
          description: Access-token TTL in seconds (900).
        tokenType:
          type: string
          enum:
            - Bearer
    RefreshRequest:
      type: object
      description: |
        Body-transport clients (mobile) send `refreshToken`. Cookie-transport clients (web) send it via the `omni_rt` cookie and omit the body field.
      properties:
        refreshToken:
          type:
            - string
            - 'null'
        deviceId:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type:
            - string
            - 'null'
          description: Body-transport refresh token (mobile). Web uses the cookie.
        familyId:
          type: string
          description: Optional — revoke a specific LISTED family owned by the caller (M-3).
    Session:
      type: object
      required:
        - familyId
        - deviceId
        - createdAt
        - lastUsedAt
        - current
      properties:
        familyId:
          type: string
        deviceId:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
        current:
          type: boolean
          description: True for the family matching the caller's omni_rt cookie (C-1).
    SessionsResponse:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
        refreshToken:
          type:
            - string
            - 'null'
          description: Optional mobile refresh token to identify the current family to spare (N-1).
    OkResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum:
            - true
    AdminResetRequest:
      type: object
      required:
        - newPassword
      properties:
        newPassword:
          type: string
    CreateOrganizationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Not unique — two shops may share a name.
        timezone:
          type: string
          default: Asia/Bangkok
          description: Optional IANA zone; defaults to Asia/Bangkok.
    NewOrganization:
      type: object
      required:
        - id
        - name
        - logo
        - timezone
        - currency
        - taxProfileComplete
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        logo:
          type:
            - string
            - 'null'
        timezone:
          type: string
        currency:
          type: string
        taxProfileComplete:
          type: boolean
          description: Always `false` on a brand-new shop.
        createdAt:
          type: string
          format: date-time
    NewOrganizationMembership:
      type: object
      required:
        - userId
        - roleId
        - roleName
        - roleKey
        - status
      properties:
        userId:
          type: string
        roleId:
          type: string
        roleName:
          type: string
        roleKey:
          type:
            - string
            - 'null'
          description: '`owner` for the creator''s system role.'
        status:
          type: string
          example: active
    EntitlementSummary:
      type: object
      description: The plan bound to a shop (`OrgEntitlement`), flattened for the wire.
      required:
        - planKey
        - tierLabel
      properties:
        planKey:
          type: string
          example: comp_full
        tierLabel:
          type:
            - string
            - 'null'
          example: Full (comp)
    WarehouseSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    CreatedOrganization:
      type: object
      description: |
        `201` of `POST /organizations`. Deliberately complete enough to enter the new shop immediately (ux Q5): a client seeds its cache from this body and does NOT need to refetch `GET /me/organizations` first.
      required:
        - organization
        - membership
        - entitlement
        - defaultWarehouse
      properties:
        organization:
          $ref: '#/components/schemas/NewOrganization'
        membership:
          $ref: '#/components/schemas/NewOrganizationMembership'
        entitlement:
          $ref: '#/components/schemas/EntitlementSummary'
        defaultWarehouse:
          $ref: '#/components/schemas/WarehouseSummary'
    OrganizationSummary:
      type: object
      description: The three fields an org switcher row needs.
      required:
        - id
        - name
        - logo
      properties:
        id:
          type: string
          example: org_01H…
        name:
          type: string
        logo:
          type:
            - string
            - 'null'
          description: |
            Phase 0: always `null`. Uploads arrive with F-040; until then `PATCH /orgs/{orgId}` accepts `null` and nothing else (M-4).
    MyOrganizationMembership:
      type: object
      description: |
        THE SHAPE DEPENDS ON `status` (M-10). For an `active` membership the role fields are present. For a shop the caller has been removed from (only reachable via `?status=all`) the server returns `status` + `revokedAt` and NOTHING else — the role they held is an internal fact about an org they are no longer part of.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - active
            - invited
            - revoked
        roleId:
          type: string
          description: Present only on the `active` (full) shape.
        roleName:
          type: string
          description: Present only on the `active` (full) shape.
        roleKey:
          type:
            - string
            - 'null'
          description: Present only on the `active` (full) shape.
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Present only on the revoked (short) shape.
    MyOrganizationItem:
      type: object
      required:
        - organization
        - membership
      properties:
        organization:
          $ref: '#/components/schemas/OrganizationSummary'
        membership:
          $ref: '#/components/schemas/MyOrganizationMembership'
        entitlement:
          description: Present only on the `active` (full) shape; absent on a revoked row.
          oneOf:
            - $ref: '#/components/schemas/EntitlementSummary'
            - type: 'null'
    MyOrganizationsPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyOrganizationItem'
        nextCursor:
          type:
            - string
            - 'null'
          description: '`null` means there is no next page.'
    TaxProfileView:
      type: object
      description: |
        The shop's tax identity AS THIS CALLER MAY SEE IT (api-spec §3.3, three tiers). EVERY field is optional and a client MUST work when any of them is absent:
          • caller with `manage_org_settings` → `entityType`, `taxIdMasked`,
            `vatRegistered`, `branchCode`;
          • any other active member → `vatRegistered` ONLY (no digits at all, not
            even the last four — ux Q13);
          • nothing declared yet → the whole object is `null` (for every tier).
        ⛔ There is no `taxId` here and there never will be. The full number comes from `POST /orgs/{orgId}/tax-profile/reveal` alone. ⛔ Do NOT read "no `taxIdMasked`" as "not declared" — `taxProfileComplete` on the parent answers that question.
      properties:
        entityType:
          type: string
          enum:
            - personal
            - company
        taxIdMasked:
          type: string
          description: Last four digits only, e.g. `•••••••••4567`.
          example: •••••••••4567
        vatRegistered:
          type: boolean
        branchCode:
          type: string
          description: 5 digits; `"00000"` is head office.
          example: '00000'
    OrgMyMembership:
      type: object
      description: The CALLER's own membership in this shop.
      required:
        - roleId
        - roleName
        - roleKey
        - capabilities
        - status
      properties:
        roleId:
          type: string
        roleName:
          type: string
        roleKey:
          type:
            - string
            - 'null'
          description: |
            `owner|admin|staff` for a system role, `null` for an F-003 custom one. Open set — an unknown value MUST fall back to showing `roleName`. ⛔ Never use it to decide permissions; use `capabilities`.
        capabilities:
          type: array
          items:
            type: string
          description: |
            What the client may OFFER. Not enforcement — the server refuses the call regardless (architecture §3.1).
        status:
          type: string
          description: Always `active` here — a non-member cannot reach this endpoint.
    OrgCounts:
      type: object
      description: |
        Totals, never a list. Every active member may see HOW MANY colleagues they have; only `manage_members` may see WHO they are (D-028, PDPA).
      required:
        - activeMembers
        - pendingInvitations
      properties:
        activeMembers:
          type: integer
        pendingInvitations:
          type: integer
    OrgProfile:
      type: object
      description: |
        `GET /orgs/{orgId}`, and the `200` of `PATCH /orgs/{orgId}` and `PUT /orgs/{orgId}/tax-profile` — one mapper, one shape (api-spec §3.3).
      required:
        - id
        - name
        - logo
        - timezone
        - currency
        - taxProfile
        - taxProfileComplete
        - entitlement
        - myMembership
        - counts
      properties:
        id:
          type: string
        name:
          type: string
        logo:
          type:
            - string
            - 'null'
        timezone:
          type: string
          example: Asia/Bangkok
        currency:
          type: string
          description: Fixed `THB` in Phase 0 (D-013). Never accepted from a client.
          example: THB
        taxProfile:
          description: |
            `null` when the shop has declared nothing — at EVERY permission tier, so "not declared" is not a permission signal either.
          oneOf:
            - $ref: '#/components/schemas/TaxProfileView'
            - type: 'null'
        taxProfileComplete:
          type: boolean
          description: |
            Derived (entity type + tax id + VAT flag all present). Visible to every member. F-002 only reports it; F-007 is what gates features on it.
        entitlement:
          description: '`null` only if the shop somehow has no entitlement row.'
          oneOf:
            - $ref: '#/components/schemas/EntitlementSummary'
            - type: 'null'
        myMembership:
          $ref: '#/components/schemas/OrgMyMembership'
        counts:
          $ref: '#/components/schemas/OrgCounts'
    UpdateOrganizationRequest:
      type: object
      description: |
        `PATCH /orgs/{orgId}` (api-spec §3.4). An absent key means "leave alone"; an empty body is a valid no-op that returns the current profile.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        logo:
          type:
            - string
            - 'null'
          description: |
            ⛔ Phase 0 accepts `null` and NOTHING ELSE (M-4). Any string → `422 VALIDATION_FAILED` with `fieldErrors.logo = "ยังไม่รองรับการตั้งโลโก้ในเวอร์ชันนี้"`. An arbitrary URL here would make every member of the shop fetch a resource chosen by whoever holds `manage_org_settings`.
        timezone:
          type: string
          description: IANA zone from `Intl.supportedValuesOf('timeZone')`; anything else is 422.
          example: Asia/Bangkok
    TaxProfileRequest:
      type: object
      description: |
        `PUT /orgs/{orgId}/tax-profile` — THE WHOLE SET OR NOTHING (data-model §3.3). An empty body `{}` is legitimate and CLEARS the declaration; a partial one is `422` with a message on every missing field. `branchCode` alone is a partial declaration, not an update.
      properties:
        entityType:
          type: string
          enum:
            - personal
            - company
        taxId:
          type: string
          description: |
            13 digits + checksum (data-model §6). Separators are stripped before storage, so `1-1017-00207-36-6` and `1101700207366` are one value. Rejected → `422 TAX_ID_INVALID` + `fieldErrors.taxId`. ⚠️ With `entityType: personal` this IS the owner's national ID. It is never logged, never echoed back, and never appears in any response except `POST /orgs/{orgId}/tax-profile/reveal`.
          example: '0105551234567'
        vatRegistered:
          type: boolean
          description: A real boolean — the string `"true"` is refused, not coerced.
        branchCode:
          type: string
          pattern: ^[0-9]{5}$
          description: Optional. `"00000"` = head office.
          example: '00000'
    TaxIdReveal:
      type: object
      description: |
        `200` of `POST /orgs/{orgId}/tax-profile/reveal` — the ONLY response in the entire system that carries a full tax id (`TAX_ID_RESPONSE_ALLOWLIST` has exactly one row and CI pins its length). Every call emits `org.tax_profile.revealed` (with no TIN in the event) and counts against 20/hour per (user, shop). @frontend: hold this in screen memory only — never persist it, never log it, and re-request it if the user hides and re-shows the number.
      required:
        - taxId
        - revealedAt
      properties:
        taxId:
          type: string
          description: The full 13-digit number, as stored.
        entityType:
          type: string
          enum:
            - personal
            - company
          description: Absent on a legacy row that holds a TIN but no entity type.
        revealedAt:
          type: string
          format: date-time
    MemberRow:
      type: object
      description: |
        One row of `GET /orgs/{orgId}/members`, and the `200` body of `PATCH /orgs/{orgId}/members/{userId}` (api-spec §3.7/§3.8) — so a client never has to refetch the list to render the new state.
      required:
        - userId
        - email
        - roleId
        - roleName
        - roleKey
        - status
        - activatedAt
        - revokedAt
        - createdAt
        - isMe
        - isOwner
      properties:
        userId:
          type: string
        email:
          type: string
          description: |
            PII under PDPA — the reason this READ requires `manage_members` and the reason the response is `no-store`.
        roleId:
          type: string
        roleName:
          type: string
        roleKey:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - active
            - invited
            - revoked
          description: |
            `invited` is a dead state: memberships are created at ACCEPT time only (data-model §7). It is listed because the column allows it, not because a write path produces it.
        activatedAt:
          type:
            - string
            - 'null'
          format: date-time
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        isMe:
          type: boolean
          description: Decided server-side, so the client never compares ids itself.
        isOwner:
          type: boolean
          description: |
            This row's role holds `full_access`. Computed from CAPABILITIES, never from the role's name or key. Use it to hide buttons; the server enforces.
    MemberListPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberRow'
        nextCursor:
          type:
            - string
            - 'null'
        total:
          type: integer
          description: Present ONLY when the request asked with `?withTotal=true`.
    RevokeMemberResult:
      type: object
      description: '`200` of `DELETE /orgs/{orgId}/members/{userId}` (api-spec §3.9).'
      required:
        - userId
        - status
        - revokedAt
        - cancelledInvitations
      properties:
        userId:
          type: string
        status:
          type: string
          enum:
            - revoked
          description: Soft delete — the row stays, so history and `revokedAt` survive.
        revokedAt:
          type: string
          format: date-time
        cancelledInvitations:
          type: integer
          description: |
            Pending invitations for that email that were cancelled in the SAME transaction (normally 0 or 1) — so the UI can say "their pending invitation was withdrawn too".
    UpdateMemberRoleRequest:
      type: object
      required:
        - roleId
      properties:
        roleId:
          type: string
          description: |
            Must be a role OF THIS SHOP — otherwise `422 ROLE_INVALID`. A role id from another tenant and one that never existed are indistinguishable by construction (no cross-tenant existence oracle).
    RoleRow:
      type: object
      description: |
        One role of a shop (api-spec §3.6). Read-only in F-002; F-003 adds create/update/delete and per-role capability editing.

        ⛔ `capabilities` is deliberately NOT published here. It is the field that decides authorization (`full_access` ⇒ Owner), and putting it on a list any active member can read invites a client to compute permissions from it. The server refuses an over-privileged invitation itself (C-1/D-028), so the invite dropdown never needs to filter.
      required:
        - id
        - name
        - key
        - isSystem
      properties:
        id:
          type: string
        name:
          type: string
          description: |
            Display name. F-003 lets people rename roles, so do NOT map this to Thai copy — use `key`, and fall back to this string.
        key:
          type:
            - string
            - 'null'
          description: |
            Stable slug for TRANSLATION ONLY (ux Q4). Guaranteed `owner`, `admin` or `staff` for the three system roles — those values are part of the contract and changing one is a breaking change. `null` for any role F-003 lets a user create, because `key` is the system's namespace.

            OPEN SET: on `null` or an unrecognised value the client MUST fall back to `name`. Never `switch` without a default.

            ⛔ NEVER a permission input, on either side. "Is this the Owner?" is answered by capabilities alone (architecture §3.2 / data-model §5.2); @qa's I-45 flips a Staff role's `key` to `"owner"` in the database to prove a client that trusted it would be wrong.
        isSystem:
          type: boolean
          description: |
            True for roles the system provisions with the shop. F-003 will refuse to delete these.
    RoleListPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleRow'
        nextCursor:
          type:
            - string
            - 'null'
          description: |
            Always `null` in F-002 — a shop has exactly its three system roles until F-003. The field is present so a client written today does not need rewriting the day a fourth role exists.
    LeaveOrgResult:
      type: object
      description: '`200` of `DELETE /orgs/{orgId}/membership` (api-spec §3.17, D-029).'
      required:
        - organizationId
        - status
        - revokedAt
        - cancelledInvitations
      properties:
        organizationId:
          type: string
        status:
          type: string
          enum:
            - revoked
        revokedAt:
          type: string
          format: date-time
        cancelledInvitations:
          type: integer
    Invitation:
      type: object
      description: |
        One row of `GET /orgs/{orgId}/invitations`, and the `invitation` of the `201` from `POST /orgs/{orgId}/invitations` (api-spec §3.10/§3.11). ⛔ Never carries a token: only an HMAC of it is stored (D-018), so there is no "resend the same link" — see `POST …/invitations/{invitationId}/link`.
      required:
        - id
        - email
        - roleId
        - roleName
        - roleKey
        - status
        - expiresAt
        - tokenIssuedAt
        - invitedByUserId
        - createdAt
        - acceptedAt
        - acceptedByUserId
        - acceptedUserCreatedAfterInvite
      properties:
        id:
          type: string
          example: inv_01H…
        email:
          type: string
          description: Normalized (lower-cased, trimmed) at creation.
        roleId:
          type: string
        roleName:
          type: string
        roleKey:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - pending
            - accepted
            - cancelled
            - expired
          description: |
            Resolved at read time — a stored `pending` row past `expiresAt` reads as `expired`.
        expiresAt:
          type: string
          format: date-time
          description: |
            NON-NULL ON EVERY ROW, accepted and cancelled ones included (ux Q14). ⛔ UI must render the remaining time FROM THIS VALUE — never hard-code "7 days": an elevated role's invitation lives 24 hours, and reissuing a link restarts the clock (D-027).
        tokenIssuedAt:
          type: string
          format: date-time
          description: When the CURRENT link was minted. Moves on every reissue.
        invitedByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
          description: When the invitation first existed. Does NOT move on reissue.
        acceptedAt:
          type:
            - string
            - 'null'
          format: date-time
        acceptedByUserId:
          type:
            - string
            - 'null'
        acceptedUserCreatedAfterInvite:
          type:
            - boolean
            - 'null'
          description: |
            Was the accepting ACCOUNT created after `createdAt`? `null` until somebody accepts — "we do not know yet" is not "no". Phase 0 cannot verify email addresses, so this is the only signal that a link may have been redeemed by whoever found it. Render it as a soft flag, not an accusation.
    InvitationListPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        nextCursor:
          type:
            - string
            - 'null'
    CreateInvitationRequest:
      type: object
      required:
        - email
        - roleId
      properties:
        email:
          type: string
          format: email
          description: Normalized server-side (lower-cased + trimmed).
        roleId:
          type: string
          description: Mandatory (AC US-3) — there is no default role.
    IssuedInvitation:
      type: object
      description: |
        `201` of `POST /orgs/{orgId}/invitations`. ⚠️ `token` and `inviteUrl` are shown THIS ONCE — only an HMAC is stored. No email is sent (D-012), so the UI must offer a copy button.
      required:
        - invitation
        - token
        - inviteUrl
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        token:
          type: string
          description: The raw invitation token. Never retrievable again.
        inviteUrl:
          type: string
          format: uri
          description: Ready-to-share link containing the token.
    CancelledInvitation:
      type: object
      description: '`200` of `DELETE /orgs/{orgId}/invitations/{invitationId}`.'
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - cancelled
    ReissuedLink:
      type: object
      description: |
        `200` of `POST /orgs/{orgId}/invitations/{invitationId}/link` — 200 and not 201: nothing was created, an existing invitation's token was rotated. ⚠️ THE PREVIOUS LINK STOPS WORKING IMMEDIATELY and the expiry restarts from now (D-027), so the UI needs a confirmation dialog and must not say "copy the existing link".
      required:
        - token
        - inviteUrl
        - expiresAt
        - tokenIssuedAt
        - rotated
      properties:
        token:
          type: string
        inviteUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
          description: '`now + TTL(role)` — recomputed, not inherited.'
        tokenIssuedAt:
          type: string
          format: date-time
        rotated:
          type: boolean
          enum:
            - true
    RedeemInvitationRequest:
      type: object
      description: |
        Body of `POST /invitations/preview` and `POST /invitations/accept`. ⛔ THE TOKEN TRAVELS IN THE BODY AND ONLY IN THE BODY (I-6) — that is why both routes are POSTs. In a query string it would land in access logs, in every proxy in front of us, and in the `Referer` of anything the invite page loads. @frontend: read it out of the URL, `history.replaceState` it away immediately, and keep it in memory (never localStorage).
      required:
        - token
      properties:
        token:
          type: string
    InvitationPreview:
      type: object
      description: |
        `200` of `POST /invitations/preview` — public, for somebody who may not have an account yet (api-spec §3.14). Carries no `organizationId`, no full email address and no member list.
      required:
        - organizationName
        - roleName
        - roleKey
        - emailMasked
        - expiresAt
        - status
      properties:
        organizationName:
          type: string
        roleName:
          type: string
        roleKey:
          type:
            - string
            - 'null'
        emailMasked:
          type: string
          description: '`u***@example.com` — enough to pick the right account, not an address.'
          example: n***@example.com
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - pending
            - accepted
            - cancelled
            - expired
          description: Always `pending` on a `200`; the other states answer `409`.
    AcceptedMembership:
      type: object
      required:
        - roleId
        - roleName
        - roleKey
        - status
      properties:
        roleId:
          type: string
        roleName:
          type: string
        roleKey:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - active
    InvitationAcceptResult:
      type: object
      description: |
        `200` of `POST /invitations/accept` (api-spec §3.15). Carries no email, no invitation id and no token — the response is the last place a redeemed credential could still leak.
      required:
        - organization
        - membership
      properties:
        organization:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
            name:
              type: string
        membership:
          $ref: '#/components/schemas/AcceptedMembership'
  headers:
    RetryAfter:
      description: |
        Seconds until the backoff window clears (UX countdown source). The server GUARANTEES an integer ≥ 1 — rounded up, never `0`, never fractional, never an HTTP-date — so mobile can compute a backoff from it directly (api-spec §1, qa Q11); `org-rate-limit.guard.ts` enforces it and a unit test pins it.

        ⚠️ `minimum` stays `0` deliberately. F-001 shipped it that way, and tightening a constraint on an already-published surface is a change `oasdiff` may judge, for a guarantee that changes nothing in any generated client. The promise lives in the sentence above and in the test, which is where it can actually be enforced.
      schema:
        type: integer
        minimum: 0
    SetAuthCookies:
      description: |
        On the cookie transport, sets `omni_rt` (httpOnly, Secure, SameSite=Strict, Path=/auth) and `omni_csrf` (readable, Secure, SameSite=Strict, Path=/auth). Absent on the body transport.
      schema:
        type: string
    CacheControlNoStore:
      description: |
        Always `no-store` — this response carries a token, an email address, a tax id (masked or full) or a membership fact about a person (api-spec §1 "Cache / PII").
      schema:
        type: string
        enum:
          - no-store
    PragmaNoCache:
      description: 'HTTP/1.0 twin of `Cache-Control: no-store`. Always `no-cache`.'
      schema:
        type: string
        enum:
          - no-cache
    ReferrerPolicyNoReferrer:
      description: |
        Always `no-referrer` on the invitation routes and on `POST /orgs/{orgId}/tax-profile/reveal` (I-6 / §3.16): the PAGE these responses render on holds a token in its URL, and without this header that URL travels to whatever the page loads next.
      schema:
        type: string
        enum:
          - no-referrer
  parameters:
    OrgIdParam:
      name: orgId
      in: path
      required: true
      description: |
        Organization id. On F-002 org-scoped routes this is one of the two accepted sources of org context (the other is the `X-Organization-Id` header, D-025); sending both with different values is `422 ORG_MISMATCH`.
      schema:
        type: string
    UserIdParam:
      name: userId
      in: path
      required: true
      description: Target member's user id.
      schema:
        type: string
    CursorParam:
      name: cursor
      in: query
      required: false
      description: |
        Opaque keyset cursor from the previous page's `nextCursor`. Base64url — clients MUST NOT decode or construct one. Unreadable value → `422 VALIDATION_FAILED` with `fieldErrors.cursor`.
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      description: |
        Page size. Default 25, clamped to 100. Non-integer / < 1 → `422 VALIDATION_FAILED` with `fieldErrors.limit` (a bug is not silently corrected).
      schema:
        type: integer
        minimum: 1
        default: 25
    OrgIdHeader:
      name: X-Organization-Id
      in: header
      required: false
      description: |
        Org context (api-spec §1). Optional on routes that already carry `{orgId}` in the path; if both are sent they MUST match, otherwise `422 ORG_MISMATCH`. User-scoped and public routes ignore this header entirely (I-3).
      schema:
        type: string
    WithTotalParam:
      name: withTotal
      in: query
      required: false
      description: |
        Opt in to the `total` count on this page. OPT-IN PER ENDPOINT: only the endpoints that declare this parameter compute a total — see the endpoint's own documentation. (`GET /me/organizations` and `GET /orgs/{orgId}/invitations` do NOT support it today; api-spec §1 states the convention generally, the server implements it on `GET /orgs/{orgId}/members` only.)
      schema:
        type: boolean
        default: false
    InvitationIdParam:
      name: invitationId
      in: path
      required: true
      description: Invitation id (`inv_…`).
      schema:
        type: string
