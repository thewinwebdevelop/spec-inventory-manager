  /orgs/{orgId}/members:
    parameters:
      - $ref: '#/components/parameters/OrgIdParam'
      - $ref: '#/components/parameters/OrgIdHeader'
    get:
      operationId: listMembers
      summary: List the shop's members
      description: |
        F-002 US-5 (api-spec §3.7). ⚠️ THIS READ REQUIRES `manage_members`. Every row carries somebody's email address, which is PII under PDPA (D-028/I-8) — it is not a UX preference, and a Staff member calling it gets `403 FORBIDDEN`. If a screen needs "who did this?", take the name/id off the resource rather than pulling the whole directory.

        `status` defaults to `all` here (unlike `GET /me/organizations`, whose default is `active`): this is the audit view of who is and who WAS in the shop, and hiding removed rows by default would make "why can this person no longer sign in?" unanswerable from the UI. `invited` is not an accepted value — memberships are only created at accept time (data-model §7), so the filter could only ever return nothing. People invited but not yet joined live in `GET /orgs/{orgId}/invitations`.

        This is the ONLY list endpoint that supports `?withTotal=true` today.

        `Cache-Control: no-store` — a list of email addresses must not sit in a shared cache (M-11).
      tags:
        - members
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Default `all`. Any other value → `422`.
          schema:
            type: string
            enum:
              - active
              - revoked
              - all
            default: all
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/WithTotalParam'
      responses:
        '200':
          description: One page, sorted `createdAt desc, id desc`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListPage'
        '401':
          description: Missing/invalid access token (`UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`FORBIDDEN` (no `manage_members`) or `ORG_ACCESS_DENIED` (not a member)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `VALIDATION_FAILED` (`status` / `cursor` / `limit`) or `ORG_CONTEXT_REQUIRED` / `ORG_MISMATCH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orgs/{orgId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/OrgIdParam'
      - $ref: '#/components/parameters/UserIdParam'
      - $ref: '#/components/parameters/OrgIdHeader'
    patch:
      operationId: updateMemberRole
      summary: Change a member's role
      description: |
        F-002 US-6 (api-spec §3.8). Requires `manage_members`, and additionally `full_access` (Owner-only, D-028/C-1) when EITHER the new role holds `full_access` (promoting somebody — including yourself — to Owner) OR the target's CURRENT role holds it (editing an Owner). Otherwise `403 FORBIDDEN`.

        Acting on yourself is allowed (an Owner stepping down after appointing a successor), subject to the last-Owner rule.

        Answers with the §3.7 member row, so the client never has to refetch the list to render the new state — which is why this response carries an email address and therefore the §3.7 `no-store` policy (api-spec §1 lists §3.7 but not §3.8 by number; the classification follows the SHAPE, and `RESPONSE_HEADER_POLICY` in apps/api encodes that).

        The target's state is re-read INSIDE the transaction, after the shop's row lock is taken — so a `PATCH` racing a `DELETE` answers `404`, never a 500 or a resurrection.
      tags:
        - members
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: The updated member row (same shape as a `GET /members` item).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberRow'
        '401':
          description: Missing/invalid access token (`UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            `FORBIDDEN` — missing `manage_members`, or the Owner-only rule — or `ORG_ACCESS_DENIED` (not a member of this shop).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            `NOT_FOUND` — the target is not an ACTIVE member of this shop (including "was removed by a request that raced this one").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `LAST_OWNER` — the change would leave the shop with zero active Owners, which is unrecoverable in Phase 0 · or `CONFLICT` + `details.reason = "busy"` — this request lost the race for the shop's row lock (transient, retry; deliberately not a 500).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Non-JSON Content-Type (`UNSUPPORTED_MEDIA_TYPE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `ROLE_INVALID` — `roleId` is not a role of THIS shop (a foreign id and a non-existent id are indistinguishable by construction) · `VALIDATION_FAILED` — `roleId` missing · `ORG_CONTEXT_REQUIRED` / `ORG_MISMATCH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: revokeMember
      summary: Remove another member from the shop
      description: |
        F-002 US-5 (api-spec §3.9). Requires `manage_members`, plus `full_access` when the target is an Owner (D-028/C-1).

        SOFT delete: `status → revoked` and `revokedAt` is stamped. The row stays, because history references it and because `revokedAt` is a security input — an invitation issued BEFORE it can no longer be accepted (I-1).

        In the SAME transaction, any pending invitation for that person's email in this shop is cancelled; `cancelledInvitations` reports how many, so the UI can say so.

        Effect is immediate: the removed member's next request to this shop is `403 ORG_ACCESS_DENIED` and the shop is gone from their `GET /me/organizations`. Their session is not destroyed and their other shops are untouched.

        Removing YOURSELF through this route works, but only if you already hold `manage_members`. Everyone else uses `DELETE /orgs/{orgId}/membership` — this route grants nobody a softer path (D-029).

        Idempotency under a race: two concurrent revokes of the same person produce one `200` and one `404`, and `revokedAt` is written once.
      tags:
        - members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Removed (soft).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeMemberResult'
        '401':
          description: Missing/invalid access token (`UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            `FORBIDDEN` — missing `manage_members`, or removing an Owner without `full_access` — or `ORG_ACCESS_DENIED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND` — not an active member of this shop (any more).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `LAST_OWNER` — the shop would be left with no active Owner · or `CONFLICT` + `details.reason = "busy"` (lock contention, retry).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`ORG_CONTEXT_REQUIRED` / `ORG_MISMATCH`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orgs/{orgId}/roles:
    parameters:
      - $ref: '#/components/parameters/OrgIdParam'
      - $ref: '#/components/parameters/OrgIdHeader'
    get:
      operationId: listOrgRoles
      summary: List this shop's roles (the invite dropdown)
      description: |
        F-002 (api-spec §3.6). Any ACTIVE member may read it: the response carries no personal data and nothing about anybody else — three role names the caller can already see on their own membership. Requiring `manage_members` would mean a Staff member could not be shown the name of their own role.

        It exists because AC US-3 makes choosing a role MANDATORY when inviting somebody: without this endpoint no client can populate that dropdown, so the acceptance criterion could not be met at all.

        Read-only in F-002. F-003 adds create/update/delete.
      tags:
        - organizations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every role of this shop, oldest first.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListPage'
        '401':
          description: Missing/invalid access token (`UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            `ORG_ACCESS_DENIED` — not an active member of this shop (including the shop not existing: the two are indistinguishable on purpose, I-5).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `ORG_MISMATCH` — `X-Organization-Id` disagrees with the path (a client bug; the server never picks a side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orgs/{orgId}/membership:
    parameters:
      - $ref: '#/components/parameters/OrgIdParam'
      - $ref: '#/components/parameters/OrgIdHeader'
    delete:
      operationId: leaveOrganization
      summary: Leave this shop myself
      description: |
        F-002 US-5 / D-029 (api-spec §3.17). ANY active member may call it — NO `manage_members` required.

        ⚠️ WHY THIS IS A SEPARATE ROUTE rather than relaxing `DELETE /orgs/{orgId}/members/{userId}` when the id happens to be your own:
          1. Confused deputy closed BY SHAPE — there is no `userId` anywhere in this
             route, so the target is `ctx.userId` always and no bug can point it at
             another person. The alternative closes the same hole with an `if`, and
             an `if` is exactly what finding C-1 was.
          2. The route registry stays decidable — the capability guard reads
             metadata only; "the capability depends on a value in the path" cannot
             be expressed in metadata and would push the decision into a service,
             where forgetting it is silent.
          3. Different event: `org.member.left`, not `org.member.revoked`. Afterwards
             "did they walk out or were they cleared out?" is answerable.


        Behaviour is identical to §3.9 apart from the actor: soft revoke, own pending invitations cancelled in the same transaction, the shop disappears from `GET /me/organizations` immediately, other shops and the session untouched.

        `200` with a body rather than `204`: the caller needs `cancelledInvitations` and `revokedAt` for the confirmation copy.

        ⛔ There is NO `403 FORBIDDEN` on this route — there is no capability to lack, so a 403 here can only be `ORG_ACCESS_DENIED`.

        ⚠️ The last Owner cannot leave (`409 LAST_OWNER`) and F-002 has no "delete shop", so the way out is to appoint another Owner first. Accepted limitation.
      tags:
        - members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: You have left the shop.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveOrgResult'
        '401':
          description: Missing/invalid access token (`UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            `ORG_ACCESS_DENIED` — not an active member (which covers pressing the button twice). Never `FORBIDDEN` here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `LAST_OWNER` — you are the only active Owner; appoint another first · or `CONFLICT` + `details.reason = "busy"` (lock contention, retry).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`ORG_CONTEXT_REQUIRED` / `ORG_MISMATCH`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orgs/{orgId}/invitations:
    parameters:
      - $ref: '#/components/parameters/OrgIdParam'
      - $ref: '#/components/parameters/OrgIdHeader'
    get:
      operationId: listInvitations
      summary: List the shop's invitations
      description: |
        F-002 api-spec §3.10. Requires `manage_members` — every row carries somebody else's email address (PDPA, D-028/I-8).

        Never returns a token or a link: only an HMAC of the token is stored (D-018), so there is nothing to return. Use `POST /orgs/{orgId}/invitations/{invitationId}/link` to mint a new one.

        The members screen is ONE screen with TWO sections, fetched from this endpoint and `GET /orgs/{orgId}/members` separately and NOT merged (ux Q1): the two sources have different states and different actions (reissue/cancel vs change-role/remove), each with its own cursor and its own error states.

        ⚠️ `?withTotal=true` is NOT supported here — see the T-002-21 report.

        `Cache-Control: no-store` + `Referrer-Policy: no-referrer`.
      tags:
        - invitations
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Default `pending` — the actionable view. Any other value → `422`.
          schema:
            type: string
            enum:
              - pending
              - accepted
              - cancelled
              - expired
              - all
            default: pending
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: One page, sorted `createdAt desc, id desc`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListPage'
        '401':
          description: Missing/invalid access token (`UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`FORBIDDEN` (no `manage_members`) or `ORG_ACCESS_DENIED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `VALIDATION_FAILED` (`status` / `cursor` / `limit`) or `ORG_CONTEXT_REQUIRED` / `ORG_MISMATCH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createInvitation
      summary: Invite somebody to the shop (returns the link once)
      description: |
        F-002 US-3 (api-spec §3.11, D-012). Requires `manage_members`, plus `full_access` when the invited role itself holds `full_access` (D-028/C-1).

        ⚠️ `token` and `inviteUrl` are shown THIS ONCE. Only an HMAC is stored (D-018), so there is no "resend the same link" — and no email is sent (D-012): the UI must offer a copy button and the user forwards it.

        LIFETIME DEPENDS ON THE ROLE: 24 hours when the invited role holds `full_access` or `manage_members`, 7 days otherwise (D-028/I-7). ⛔ The UI must render `expiresAt` and never hard-code "7 days".

        Inviting an address that already has a live invitation is `409 INVITATION_PENDING` WITH `details.invitationId` (+ `expiresAt`, `roleId`, `roleName`), so the UI can immediately offer "issue a new link" or "cancel" instead of leaving the user in a dead end (D-027).

        `Cache-Control: no-store` + `Referrer-Policy: no-referrer` — the body carries a live credential.
      tags:
        - invitations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created — token and link included, once.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedInvitation'
        '401':
          description: Missing/invalid access token (`UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            `FORBIDDEN` — missing `manage_members`, or inviting an Owner-capable role without `full_access` — or `ORG_ACCESS_DENIED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `ALREADY_MEMBER` — that person is already an active member · `INVITATION_PENDING` (+`details.invitationId`) — a live invitation for that address exists · `INVITATION_LIMIT_REACHED` — too many unexpired pending invitations · `CONFLICT` + `details.reason = "busy"` (lock contention, retry).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Non-JSON Content-Type (`UNSUPPORTED_MEDIA_TYPE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `VALIDATION_FAILED` (+`fieldErrors.email` / `fieldErrors.roleId`) · `ROLE_INVALID` — the role is not one of THIS shop's · `ORG_CONTEXT_REQUIRED` / `ORG_MISMATCH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED` — 30 invitations per hour per shop.'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
