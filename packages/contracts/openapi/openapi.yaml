        F-002 api-spec §3.16 (ux Q7/Q13, D-030/NEW-11). Requires `manage_org_settings` — which Admin also holds, decided deliberately: the person who files the shop's tax documents has to be able to read the number. It is fenced by CONTROLS rather than by hiding it:
          (a) a deliberate action, never a side effect of opening the shop page;
          (b) `org.tax_profile.revealed` on every success (the event carries NO TIN);
