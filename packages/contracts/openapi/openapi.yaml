openapi: 3.1.0
info:
  title: OmniStock API
  description: |
    OmniStock — Inventory + Marketplace Sync + Thai Cloud Accounting platform. This spec is the single source of truth for the API contract shared by apps/api (NestJS, implements it), apps/web (Next.js, consumes the generated TS client), and apps/mobile (Flutter, consumes the generated Dart client). See docs/02-architecture.md and docs/features/F-000/architecture.md §4.

    Conventions that hold for every F-002 endpoint (api-spec §1): bearer access token; org context via `X-Organization-Id` OR the `{orgId}` path param, and `422 ORG_MISMATCH` if both are sent and disagree; `application/json` only (`415` otherwise); one error envelope `{ error: { code, message, details?, fieldErrors?, traceId? } }` and the client switches on `code` ALONE, never on `message`; money is a decimal STRING, stock is an integer; timestamps are ISO-8601 UTC; lists are cursor-paginated `{ items, nextCursor, total? }` sorted `createdAt desc, id desc`; `Retry-After` is always an integer ≥ 1.
  version: 0.0.1
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: system
    description: Liveness/readiness.
  - name: auth
    description: F-001 — accounts, sessions, passwords.
  - name: organizations
    description: F-002 — shops, profile, plan, tax identity.
  - name: members
    description: F-002 — who is in a shop, and leaving one.
  - name: invitations
    description: F-002 — inviting people and redeeming links.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness/readiness probe
      description: |
        F-000 seed endpoint — proves the contracts codegen pipeline end to end. Implemented by apps/api in T-000-08 (incl. redis/bullmq probe, AC15). Response shape here covers the minimal AC11 seam; richer probe detail is added by T-000-08 without breaking this shape (additive only, see contract-evolution skill).
      tags:
        - system
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: |
            Service is unhealthy — one or more dependencies (e.g. Redis/BullMQ, see T-000-08) failed their readiness check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/signup:
    post:
      operationId: authSignup
      summary: Create a user account (email + password)
      description: |
        US-1. Public (IP-throttled). Creates a user with verified=false and returns NO tokens (MVP: client then calls /auth/login). All /auth/* POSTs require Content-Type: application/json (415 otherwise, login-CSRF defense, L-2).
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created (no tokens issued)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '409':
          description: Email already taken (the one necessary enumeration leak, Gate 1 §4)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Non-JSON Content-Type (L-2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Password policy or email validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: IP rate limit tripped (Retry-After seconds)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      operationId: authLogin
      summary: Authenticate and receive tokens
      description: |
        US-2. Public (IP + account throttle). The client declares its transport via `tokenTransport` (default "body"). With "cookie" (web) the refresh token is set as an httpOnly Secure SameSite=Strict cookie `omni_rt` (Path=/auth) plus a readable `omni_csrf` cookie, and the body `refreshToken` is null (H-1). With "body" (mobile/default) the plaintext refresh token is returned in the body and no cookies are set. Wrong password and unknown email both return the identical 401 INVALID_CREDENTIALS (enumeration-safe). Throttle is ALWAYS its own 429 + Retry-After (M-1), never folded into the 401.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated — token pair issued
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials (generic — wrong password or unknown email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Non-JSON Content-Type (L-2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Malformed request (e.g. invalid deviceId / email shape)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: IP or account backoff tripped (Retry-After seconds)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Rotate the refresh token → new token pair
      description: |
        US-3. Dual-transport: the refresh token is presented via the `omni_rt` cookie (web) OR a body `refreshToken` field (mobile). Resolution order: cookie first, then body. On the cookie path an `X-CSRF-Token` header must equal the `omni_csrf` cookie (403 otherwise). The response follows the presented transport. Rotation mints a new refresh token; the old one becomes unusable. Reuse of a consumed/revoked token outside the 60s leeway (D-011) revokes the whole family, but the wire response is the same generic 401 INVALID_REFRESH. IP-throttled (L-5) — no account dimension. Auth is carried by the cookie or body (not a standard bearer/apiKey scheme), so `security` is [].
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated — new token pair issued (transport follows the presented one)
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: |
            Refresh token unknown / expired / not current / family-cap reached / benign-retry / reuse — all generic INVALID_REFRESH (or NO_REFRESH_TOKEN when neither cookie nor body is present).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF check failed on the cookie path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Non-JSON Content-Type (L-2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: IP rate cap tripped (Retry-After seconds, L-5)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      operationId: authLogout
      summary: Revoke the current session (family)
      description: |
        US-4. Revokes the caller's current family (from the presented refresh token; cookie or body) and clears the auth cookies. Optional body `familyId` revokes a specific LISTED family that MUST belong to the caller (M-3); a foreign/unknown familyId is a no-op. Always 204 (idempotent). CSRF-checked on the cookie path. Auth is via the refresh token (cookie/body), so `security` is [].
      tags:
        - auth
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out (idempotent — always 204)
        '403':
          description: CSRF check failed on the cookie path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Non-JSON Content-Type (L-2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout-all:
    post:
      operationId: authLogoutAll
      summary: Revoke ALL the user's sessions
      description: |
        US-4. Bearer-authed. Revokes every family for the authenticated user and clears the caller's cookies. 204.
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All sessions revoked
        '401':
          description: Missing/invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Non-JSON Content-Type (L-2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/sessions:
    get:
      operationId: authSessions
      summary: List the user's live sessions/devices
      description: |
        US-3. Bearer-authed. Lists live (non-revoked, non-expired) families for the user — bounded at 20 (D-017). The family matching the `omni_rt` cookie (if present) is marked current. Also reads the cookie to mark current — that is an input, not an auth requirement.
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Live sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
        '401':
          description: Missing/invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/change-password:
    post:
      operationId: authChangePassword
      summary: Change the caller's own password
      description: |
        US-6 (D-008). Bearer-authed, org-agnostic. Verifies currentPassword (account-throttled, N-2), enforces the signup policy on newPassword, sets the new hash, and revokes all the caller's OTHER families — sparing the current family resolved from the presented refresh token (cookie/body, N-1); if none is resolvable, revokes ALL (safe direction). CSRF-checked on the cookie path.
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Missing/invalid access token, or wrong currentPassword (generic)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF check failed on the cookie path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Non-JSON Content-Type (L-2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: newPassword policy failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: currentPassword backoff tripped (Retry-After seconds, N-2)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orgs/{orgId}/members/{userId}/reset-password:
    post:
      operationId: authAdminResetPassword
      summary: Admin resets a member's password
      description: |
        US-5. Bearer-authed. The capability check is INLINE application logic (F-001-owned): the caller must have an ACTIVE Membership(orgId) whose role grants `manage_members`, AND the target must be an ACTIVE member of orgId (H-2). Any failure → the same-shape 404 (never 403 — no org-existence/status/capability oracle). On success: sets the target's password and revokes all the target's families. The capability check is not expressible as an OpenAPI security requirement.

        ⚠️ THE WIRE SHAPE IS UNCHANGED SINCE F-001, BUT THE BEHAVIOUR NARROWED TWICE — cases that used to answer `200` now answer the SAME `404`, and no diff tool can see it (api-spec §2 note / architecture §15):
          • D-028/C-2 — the target also holds an active membership in ANOTHER shop;
          • D-030/NEW-1 — the target is an Owner (role holds `full_access`) and the
            caller does not hold `full_access`.
        Accepted consequence (D-030): a shop with a single Owner who forgets their password cannot self-recover until F-081.
      tags:
        - auth
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgIdParam'
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetRequest'
      responses:
        '200':
          description: Member password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Missing/invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Same-shape not-found — caller lacks an active membership / capability, or the target is not an active member (never 403; no enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            ADDITIVE (T-002-21, closing a documentation debt — the server has answered this since T-002-09/§15 row 6b, the contract simply never said so). `CONFLICT` + `details.reason = "busy"`: this request lost the race for the shop's row lock, or hit a deadlock / statement timeout. It is transient — retry. It is deliberately NOT a 500 (ordinary contention must not page on-call) and deliberately NOT folded into the uniform 404 (that would make a retryable state look like a permission answer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Non-JSON Content-Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: newPassword policy failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Admin reset-attempt backoff tripped (Retry-After seconds)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /organizations:
    post:
      operationId: createOrganization
      summary: Create a shop (organization)
      description: |
        F-002 US-1 (api-spec §3.1). USER-SCOPED: there is no org context on this request and there must not be one — the shop does not exist yet, so any `X-Organization-Id` the caller sends is ignored (I-3).

        The `201` is deliberately complete enough to enter the new shop immediately (ux Q5): org, the creator's membership + role, the entitlement and the default warehouse. Seed the cache from it; do not refetch `GET /me/organizations` before navigating.

        Everything is provisioned in ONE transaction: Organization + the three system Roles + the creator's Owner Membership + OrgEntitlement + a default Warehouse. The plan comes from a server-side env seam and FAILS CLOSED (`503 ORG_PROVISIONING_UNAVAILABLE`) rather than falling back to a tier nobody authorised.

        Rate limit 10/hour/user (abuse control, fails OPEN if Redis is down). The 50-shops-per-user cap is enforced separately IN the transaction and fails CLOSED (`409 ORG_LIMIT_REACHED` with `details.limit`).
      tags:
        - organizations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Shop created — the body is enough to enter it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedOrganization'
        '401':
          description: Missing/invalid access token (`UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `ORG_LIMIT_REACHED` — the caller is already an active member of the maximum number of shops. `details.limit` carries the real number so the UI never hard-codes it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Non-JSON Content-Type (`UNSUPPORTED_MEDIA_TYPE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_FAILED` with `fieldErrors` (`name`, `timezone`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED` — 10 shop creations per hour per user'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            `ORG_PROVISIONING_UNAVAILABLE` — no default plan is configured to bind the new shop to. Our misconfiguration, not the caller's input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/organizations:
    get:
      operationId: listMyOrganizations
      summary: List the shops I belong to (org switcher)
      description: |
        F-002 US-2 (api-spec §3.2). USER-SCOPED — "which shops am I in?" has no single org to be scoped to, so `X-Organization-Id` is ignored (I-3).

        `status=active` (the default) is evaluated as a DATABASE FILTER on every request: no cache, no TTL. A client that receives `403 ORG_ACCESS_DENIED` refetches this endpoint and the shop it was removed from is already gone (AC US-5 / D-027).

        `status=all` additionally returns shops the caller was removed from, and those rows come back in the SHORT shape — id, name, status, `revokedAt` and nothing else (M-10). The role they held and the plan that shop is on are internal facts about an organization they are no longer part of.

        ⚠️ `?withTotal=true` is NOT supported here (see the T-002-21 report): api-spec §1 states the convention generally, but only `GET /orgs/{orgId}/members` implements it. An unknown query parameter is ignored, so asking for it simply yields no `total`.
      tags:
        - organizations
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: |
            `active` (default) returns the full shape. `all` adds shops the caller was removed from, in the short shape. Any other value → `422`.
          schema:
            type: string
            enum:
              - active
              - all
            default: active
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: One page, sorted `createdAt desc, id desc`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyOrganizationsPage'
        '401':
          description: Missing/invalid access token (`UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `VALIDATION_FAILED` — unknown `status`, unreadable `cursor`, or a `limit` that is not a positive integer (`fieldErrors` names the field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orgs/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgIdParam'
      - $ref: '#/components/parameters/OrgIdHeader'
    get:
      operationId: getOrganization
      summary: Shop profile (org + plan + tax status + my membership)
      description: |
        F-002 api-spec §3.3. Any ACTIVE member may call it; the body is safe for them because it goes through the PDPA mapper — no member list, no full tax id, and `taxIdMasked` only for a caller holding `manage_org_settings` (ux Q13, which is stricter than D-028).

        `myMembership.capabilities` exists so the client can hide buttons it should not offer. It is NOT enforcement — the server refuses the call regardless.

        `Cache-Control: no-store` always: the body carries the shop's name and its tax status.
      tags:
        - organizations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The shop profile, field-filtered for this caller.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgProfile'
        '401':
          description: Missing/invalid access token (`UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            `ORG_ACCESS_DENIED` — not an active member of this shop (covers "the shop does not exist" and "you were removed"). ⚠️ Distinct from `FORBIDDEN`: the client sends the user back to the shop picker and refetches `GET /me/organizations`, rather than staying on the page with a toast. Never merge the two codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `ORG_CONTEXT_REQUIRED` (no org in path or header) or `ORG_MISMATCH` (both sent and they disagree — a client bug, deliberately NOT a 403 so a valid member is not bounced out of the shop they are looking at).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateOrganization
      summary: Update the shop's name / logo / timezone
      description: |
        F-002 api-spec §3.4. Requires `manage_org_settings`. Returns the SAME body as `GET` — one mapper, so the field-level authorization cannot drift between the two.

        An absent key means "leave alone"; an empty patch is a valid no-op that returns the current profile. `logo` accepts `null` and nothing else until F-040 mints object keys (M-4).
      tags:
        - organizations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated — same shape as `GET /orgs/{orgId}`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgProfile'
        '401':
          description: Missing/invalid access token (`UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            `FORBIDDEN` — an active member without `manage_org_settings` (stay on the page, show a toast) — or `ORG_ACCESS_DENIED` — not a member at all (go back to the shop picker).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Non-JSON Content-Type (`UNSUPPORTED_MEDIA_TYPE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `VALIDATION_FAILED` with `fieldErrors` — every rejected field at once (`name`, `logo`, `timezone`) — or `ORG_CONTEXT_REQUIRED` / `ORG_MISMATCH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orgs/{orgId}/tax-profile:
    parameters:
      - $ref: '#/components/parameters/OrgIdParam'
      - $ref: '#/components/parameters/OrgIdHeader'
    put:
      operationId: putTaxProfile
      summary: Declare (or clear) the shop's legal tax identity
      description: |
        F-002 US-7 (api-spec §3.5). Requires `manage_org_settings`. `PUT` of the WHOLE set: send the complete declaration, or `{}` to clear it. There is no half-declared state (data-model §3.3), so a partial body is `422` with a message on every field that is missing.

        ⚠️ THE RESPONSE DOES NOT ECHO `taxId` BACK. It is the ordinary §3.3 profile body — `taxIdMasked` at most. The caller typed the number, so returning it adds nothing and only multiplies the places a full TIN appears. The value is never logged either; the security event records `taxIdPresent` and `entityType` only.

        F-002 stores the declaration and exposes `taxProfileComplete`. Gating features on it is F-007's job, not this endpoint's.
      tags:
        - organizations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxProfileRequest'
      responses:
        '200':
          description: |
            Stored — answers with the §3.3 profile body (`taxProfileComplete: true` once the trio is present).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgProfile'
        '401':
          description: Missing/invalid access token (`UNAUTHENTICATED`)
